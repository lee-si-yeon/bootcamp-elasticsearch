spring:
  application:
    name: elasticsearch
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${DATABASE_NAME:vectordb}
    username: ${DATABASE_USERNAME:vector}
    password: ${DATABASE_PASSWORD:vector123}
  jpa:
    hibernate:
      ddl-auto: update # 외부 DB(PostgreSQL)는 기본값이 none이라 테이블이 만들어지지 않는다
    show-sql: true
    properties:
      hibernate:
        format_sql: true
